<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>Campus Help Desk</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="container">

        <h1>Campus Help Desk</h1>

        <p class="subtitle">
            Submit and manage campus related problems
        </p>

        <form id="requestForm">

            <input
                type="hidden"
                id="requestId"
            >

            <label>Student Name</label>

            <input
                type="text"
                id="studentName"
                placeholder="Enter your name"
                required
            >


            <label>Email</label>

            <input
                type="email"
                id="email"
                placeholder="Enter your email"
                required
            >


            <label>Category</label>

            <select id="category" required>

                <option value="">
                    Select Category
                </option>

                <option value="Hostel">
                    Hostel
                </option>

                <option value="Library">
                    Library
                </option>

                <option value="Transport">
                    Transport
                </option>

                <option value="Canteen">
                    Canteen
                </option>

                <option value="Classroom">
                    Classroom
                </option>

                <option value="Other">
                    Other
                </option>

            </select>


            <label>Problem Description</label>

            <textarea
                id="description"
                placeholder="Describe your problem"
                required
            ></textarea>


            <label>Priority</label>

            <select id="priority" required>

                <option value="">
                    Select Priority
                </option>

                <option value="Low">
                    Low
                </option>

                <option value="Medium">
                    Medium
                </option>

                <option value="High">
                    High
                </option>

            </select>


            <button type="submit" id="submitButton">
                Submit Request
            </button>

        </form>


        <h2>Submitted Requests</h2>

        <div id="requestList">

        </div>

    </div>


    <script src="script.js"></script>

</body>

</html>
